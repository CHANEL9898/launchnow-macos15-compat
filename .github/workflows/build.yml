name: Build LaunchNow (macOS 15, Xcode 16.4)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s "/Applications/Xcode_16.4.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build LaunchNow (Release, arm64, deployment target macOS 15.0)
        run: |
          set -o pipefail
          xcodebuild -project LaunchNow.xcodeproj \
            -scheme LaunchNow \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | tail -60

      - name: Inject app icon, ad-hoc sign and package
        run: |
          APP="build/Build/Products/Release/LaunchNow.app"
          echo "==> Bundle contents:"
          ls -la "$APP/Contents" "$APP/Contents/Resources" || true

          # 1) 用仓库内原版图标源图生成 icns（源图来自原工程 AppIcon.icon）
          ICONSET="icon-tmp/AppIcon.iconset"
          mkdir -p "$ICONSET"
          SRC="LaunchNow/AppIcon.icon/Assets/未命名 2.png"
          sips -z 16 16    "$SRC" --out "$ICONSET/icon_16x16.png"        >/dev/null
          sips -z 32 32    "$SRC" --out "$ICONSET/icon_16x16@2x.png"     >/dev/null
          sips -z 32 32    "$SRC" --out "$ICONSET/icon_32x32.png"        >/dev/null
          sips -z 64 64    "$SRC" --out "$ICONSET/icon_32x32@2x.png"     >/dev/null
          sips -z 128 128  "$SRC" --out "$ICONSET/icon_128x128.png"      >/dev/null
          sips -z 256 256  "$SRC" --out "$ICONSET/icon_128x128@2x.png"   >/dev/null
          sips -z 256 256  "$SRC" --out "$ICONSET/icon_256x256.png"      >/dev/null
          sips -z 512 512  "$SRC" --out "$ICONSET/icon_256x256@2x.png"   >/dev/null
          sips -z 512 512  "$SRC" --out "$ICONSET/icon_512x512.png"      >/dev/null
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"  >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          # 2) 确保 Info.plist 指向图标
          plutil -replace CFBundleIconFile -string AppIcon "$APP/Contents/Info.plist"

          # 3) 检查部署目标与本地化资源
          echo "==> Minimum system version:"
          plutil -p "$APP/Contents/Info.plist" | grep -i "LSMinimumSystemVersion\|CFBundleShortVersion\|LSUIElement"
          echo "==> Localizations in bundle:"
          ls "$APP/Contents/Resources" | grep lproj || echo "(no lproj found)"

          # 4) ad-hoc 签名（无团队证书，本地运行足够）
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier|Runtime" || true

          # 5) 打包（ditto 保留权限与结构）
          cd build/Build/Products/Release
          rm -f LaunchNow-macOS15-arm64.zip
          ditto -c -k --keepParent LaunchNow.app LaunchNow-macOS15-arm64.zip
          ls -lh LaunchNow-macOS15-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaunchNow-macOS15-arm64
          path: build/Build/Products/Release/LaunchNow-macOS15-arm64.zip
          retention-days: 14
